name: windows-exe

on:
  push:
    branches:
      - experiment/lichii-build-130-1-save-freeze
    paths:
      - .github/workflows/windows-exe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows MSVC - post-build-130 + PR 1218
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Check out experiment metadata
        uses: actions/checkout@v4

      - name: Pin source to tested upstream PR 1218 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git remote add lichii-upstream https://github.com/zortos293/Lichii.git
          # The PR depends on 26 upstream commits after build-130; cherry-picking
          # onto build-130 conflicts in nx2_stub_device.h. Use the whole pinned
          # source snapshot, never an auto-resolved or partial cherry-pick.
          git fetch --no-tags --depth=1 lichii-upstream pull/1218/head
          test "$(git rev-parse FETCH_HEAD)" = "396760eea92e98c48f127342b316c8ed26928f3b"
          git checkout --detach FETCH_HEAD
          git log -1 --format="%H %s"
          echo "Source: upstream PR #1218 head 396760ee, post-build-130 experimental" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Fix upstream MSVC shadow warning in recommended_settings.cpp (CI only)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/common/recommended_settings.cpp")
          s = p.read_text(encoding="utf-8")
          assert s.count("Values& values") == 2, "upstream signature changed"
          assert s.count("ForEachRecommendedSetting(values,") == 2, "upstream call count changed"
          s = s.replace("Values& values", "Values& settings_values")
          s = s.replace("ForEachRecommendedSetting(values,", "ForEachRecommendedSetting(settings_values,")
          s = s.replace("values.recommended_settings_backup", "settings_values.recommended_settings_backup")
          assert "Values& values" not in s
          p.write_text(s, encoding="utf-8")
          PY
          git diff --check
          git diff -- src/common/recommended_settings.cpp

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DLICHII_BUILD_TAG=130.1-experimental
          -DLICHII_BUILD_PLATFORM=windows-x86_64
          -DUSE_DISCORD_PRESENCE=OFF

      - name: Build
        shell: bash
        run: cmake --build build/release --target yuzu yuzu-cmd --parallel 4

      - name: Package as untested ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/release/bin/lichii.exe')) { throw 'lichii.exe not produced' }
          windeployqt --release --no-translations build/release/bin/lichii.exe
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item -Recurse build/release/bin/* package/
          @'
          LICHII BUILD 130.1 - EXPERIMENTAL, NOT A VERIFIED FIX
          Source: post-build-130 PR #1218 head (396760eea92e98c48f127342b316c8ed26928f3b)
          Experimental code including proposed PR: https://github.com/zortos293/Lichii/pull/1218
          Bug investigated: Zelda Ocarina of Time loads a save, then hangs at Game: 0 FPS.
          The patch fixes a GPU memory registry lock-order deadlock in a related OoT scenario.
          NO save-loading gameplay validation has been performed on the user's RTX A500 laptop.
          BACK UP saves before testing. DO NOT overwrite your existing Lichii installation.
          Upstream updates do not automatically include this experimental patch.
          '@ | Set-Content -Path package/EXPERIMENTAL-READ-ME.txt
          Compress-Archive -Path package/* -DestinationPath Lichii-130.1-experimental-windows.zip

      - name: Upload experimental artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lichii-130.1-experimental-windows
          path: Lichii-130.1-experimental-windows.zip
          if-no-files-found: error
          retention-days: 14
